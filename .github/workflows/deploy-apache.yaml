name: Deploy Apache to GKE

on:
  push:
    branches: [ 'main', 'develop' ]
    paths:
      - 'apache-deployment/**'
      - '.github/workflows/deploy-apache.yaml'
  pull_request:
    branches: [ 'main', 'develop' ]
    paths:
      - 'apache-deployment/**'
  workflow_dispatch:

env:
  PROJECT_ID: "ornate-producer-477604-s3"
  GKE_CLUSTER: "gke-standard-cluster"
  GKE_LOCATION: "us-central1-a"
  DEPLOYMENT_NAME: apache-deployment
  DEPLOYMENT_NAMESPACE: default
  APACHE_DEPLOYMENT_PATH: ./apache-deployment

jobs:
  deploy:
    name: Deploy Apache to GKE
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:

    - name: Checkout code
      uses: actions/checkout@v4

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Set up gcloud CLI
      uses: google-github-actions/setup-gcloud@v2
      with:
        project_id: ${{ env.PROJECT_ID }}

    - name: Install kubectl
      run: |
        gcloud components install kubectl -q

    - name: Get GKE credentials
      run: |
        gcloud container clusters get-credentials \
          ${{ env.GKE_CLUSTER }} \
          --zone ${{ env.GKE_LOCATION }} \
          --project ${{ env.PROJECT_ID }}

    - name: Verify cluster connection
      run: |
        echo "Checking cluster connection..."
        kubectl cluster-info
        echo "Available nodes:"
        kubectl get nodes
        echo "Available namespaces:"
        kubectl get ns

    - name: Create or verify namespace
      run: |
        kubectl create namespace ${{ env.DEPLOYMENT_NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -
        echo "✓ Namespace ${{ env.DEPLOYMENT_NAMESPACE }} is ready"

    - name: Apply ConfigMap
      run: |
        echo "Applying Apache ConfigMap..."
        kubectl apply -f ${{ env.APACHE_DEPLOYMENT_PATH }}/configmap.yaml \
          --namespace ${{ env.DEPLOYMENT_NAMESPACE }}
        echo "✓ ConfigMap applied successfully"

    - name: Apply Deployment
      run: |
        echo "Applying Apache Deployment..."
        kubectl apply -f ${{ env.APACHE_DEPLOYMENT_PATH }}/deployment.yaml \
          --namespace ${{ env.DEPLOYMENT_NAMESPACE }}
        echo "✓ Deployment applied successfully"

    - name: Wait for deployment rollout
      run: |
        echo "Waiting for Apache deployment to be ready..."
        kubectl rollout status deployment/${{ env.DEPLOYMENT_NAME }} \
          --namespace ${{ env.DEPLOYMENT_NAMESPACE }} \
          --timeout=5m
        echo "✓ Deployment rollout completed"

    - name: Apply Service
      run: |
        echo "Applying Apache Service..."
        kubectl apply -f ${{ env.APACHE_DEPLOYMENT_PATH }}/service.yaml \
          --namespace ${{ env.DEPLOYMENT_NAMESPACE }}
        echo "✓ Service applied successfully"

    - name: Get deployment status
      run: |
        echo "=== Apache Deployment Status ==="
        kubectl get deployment -n ${{ env.DEPLOYMENT_NAMESPACE }} -l app=apache
        echo ""
        echo "=== Apache Pods Status ==="
        kubectl get pods -n ${{ env.DEPLOYMENT_NAMESPACE }} -l app=apache
        echo ""
        echo "=== Apache Service Status ==="
        kubectl get svc -n ${{ env.DEPLOYMENT_NAMESPACE }} -l app=apache
        echo ""
        echo "=== Apache Service Details ==="
        kubectl describe svc apache-service -n ${{ env.DEPLOYMENT_NAMESPACE }}

    - name: Wait for service external IP
      run: |
        echo "Waiting for LoadBalancer external IP..."
        for i in {1..30}; do
          EXTERNAL_IP=$(kubectl get svc apache-service \
            -n ${{ env.DEPLOYMENT_NAMESPACE }} \
            -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null)
          if [ -z "$EXTERNAL_IP" ]; then
            echo "Waiting for external IP... ($i/30)"
            sleep 10
          else
            echo "✓ External IP assigned: $EXTERNAL_IP"
            exit 0
          fi
        done
        echo "⚠ Note: External IP not yet assigned, this may take a few more minutes"

    - name: Deployment summary
      run: |
        echo "✅ Apache deployment to GKE completed successfully!"
        echo ""
        echo "📋 Deployment Summary:"
        echo "   Project ID: ${{ env.PROJECT_ID }}"
        echo "   Cluster: ${{ env.GKE_CLUSTER }}"
        echo "   Location: ${{ env.GKE_LOCATION }}"
        echo "   Namespace: ${{ env.DEPLOYMENT_NAMESPACE }}"
        echo "   Deployment: ${{ env.DEPLOYMENT_NAME }}"
        echo ""
        echo "🔗 To access Apache:"
        echo "   kubectl port-forward -n ${{ env.DEPLOYMENT_NAMESPACE }} svc/apache-service 8080:80"
        echo "   Then visit: http://localhost:8080"

  verify:
    name: Verify Apache Deployment
    runs-on: ubuntu-latest
    needs: deploy
    if: success()
    permissions:
      contents: read
      id-token: write

    steps:

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Set up gcloud CLI
      uses: google-github-actions/setup-gcloud@v2
      with:
        project_id: ${{ env.PROJECT_ID }}

    - name: Install kubectl
      run: |
        gcloud components install kubectl -q

    - name: Get GKE credentials
      run: |
        gcloud container clusters get-credentials \
          ${{ env.GKE_CLUSTER }} \
          --zone ${{ env.GKE_LOCATION }} \
          --project ${{ env.PROJECT_ID }}

    - name: Verify Apache pods are running
      run: |
        echo "Verifying Apache pods..."
        READY_REPLICAS=$(kubectl get deployment apache-deployment \
          -n default \
          -o jsonpath='{.status.readyReplicas}')
        DESIRED_REPLICAS=$(kubectl get deployment apache-deployment \
          -n default \
          -o jsonpath='{.spec.replicas}')
        
        echo "Ready Replicas: $READY_REPLICAS / $DESIRED_REPLICAS"
        
        if [ "$READY_REPLICAS" -eq "$DESIRED_REPLICAS" ]; then
          echo "✓ All Apache pods are running successfully"
        else
          echo "⚠ Not all pods are ready yet. This may take a few moments."
          exit 1
        fi

    - name: Check pod logs
      if: always()
      run: |
        echo "=== Apache Pod Logs ==="
        kubectl logs -n default -l app=apache --tail=20 || true
