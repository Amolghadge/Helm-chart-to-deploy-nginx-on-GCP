name: Deploy NGINX to GKE

on:
  push:
    branches: [ '**' ]  # Triggers on push to any branch
  pull_request:
    branches: [ '**' ]  # Triggers on PR to any branch
  workflow_dispatch:

env:
  PROJECT_ID: "ornate-producer-477604-s3"
  GKE_CLUSTER: "gke-cluster"
  GKE_LOCATION: "us-central1"
  RELEASE_NAME: nginx-release
  CHART_PATH: ./nginx-chart

jobs:
  deploy:
    name: Deploy Helm Chart to GKE
    runs-on: ubuntu-latest

    steps:

    - name: Checkout code
      uses: actions/checkout@v4

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Set up gcloud CLI
      uses: google-github-actions/setup-gcloud@v2
      with:
        project_id: ${{ env.PROJECT_ID }}

    - name: Install kubectl
      run: |
        gcloud components install kubectl -q

    - name: Get GKE credentials
      run: |
        gcloud container clusters get-credentials \
          ${{ env.GKE_CLUSTER }} \
          --region ${{ env.GKE_LOCATION }} \
          --project ${{ env.PROJECT_ID }}

    - name: Verify cluster connection
      run: |
        kubectl get nodes
        kubectl get ns

    - name: Set up Helm
      uses: azure/setup-helm@v4
      with:
        version: v3.13.0

    - name: Deploy Helm Chart to GKE
      run: |
        helm upgrade --install ${{ env.RELEASE_NAME }} ${{ env.CHART_PATH }} \
          --namespace default \
          --create-namespace \
          --timeout 10m \
          --wait 2>&1 | grep -v "metrics.k8s.io" || true

        echo "✅ Helm deployment completed successfully."
